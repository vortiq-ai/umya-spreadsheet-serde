# CI for vortiq-ai/umya-spreadsheet-serde, the fork every vortiq-ai Rust repo builds
# `umya-spreadsheet` from (all split Cargo.lock files pin a commit of this repo).
#
# WHAT IT GATES is what the consumers compile: the library with the `serde`
# feature, built and tested. beyondcell-common, beyondcell-workbook and
# beyondcell-workbook-pod each declare `features = ["serde"]`, and every other
# repo reaches umya through them, so no consumer builds another feature set.
#
# GitHub-hosted on purpose. This repository is PUBLIC (a fork of
# MathNya/umya-spreadsheet). The org's self-hosted runner group refuses public
# repositories, and a public repository must never run on self-hosted runners:
# a pull request from any fork would execute code inside the cluster. Hosted
# minutes are free for public repositories.
#
# Rust 1.98.0, pinned: the version the consumers' build image (vq-builder) uses.
#
# GATED SINCE 2026-10-02: rustfmt and clippy on the library. Both were red on
# lines this fork added (14 rustfmt hunks, 3 clippy errors, measured 2026-09-30)
# until 7eedccb7 and 3e3fdedc cleared them; master 29e0714b passes both, so the
# gates start green. NOT gated: clippy on the test targets, which still carry 8
# findings (strict float comparisons, a deprecated getter, an inline format
# argument). Fixing them is the code owners' call; a gate that is red on arrival
# teaches everyone to ignore CI.
#
# NOT BUILT HERE: wasm32. umya alone cannot build for it, because getrandom 0.4
# needs the `wasm_js` opt-in that beyondcell-frontend/codec-wasm declares. That
# repo's build:wasm step is the wasm gate for a change here.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Run it by hand from the Actions tab, e.g. after a toolchain or runner change.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing fetches again, and the tests run this repository's code.
          persist-credentials: false

      - name: Install Rust 1.98.0
        id: toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal -c clippy --no-self-update
          rustup default 1.98.0
          rustc --version
          cargo --version

      # rustfmt.toml turns on unstable options, so it needs a nightly rustfmt. A
      # DATED nightly, so a new nightly cannot turn this red on a day nothing here
      # changed. Move the date deliberately, and reformat in the same commit.
      - name: Check formatting
        id: fmt
        run: |
          rustup toolchain install nightly-2026-10-01 --profile minimal -c rustfmt --no-self-update
          cargo +nightly-2026-10-01 fmt --all -- --check

      # The library as the consumers compile it (`--features serde`), with every
      # lint src/lib.rs enables (pedantic among them), warnings as errors.
      - name: Clippy
        id: clippy
        run: cargo clippy --features serde -- -D warnings

      - name: Build
        id: build
        run: cargo build --features serde

      # Not --all-targets: that skips the doc-tests, which are 79 of the 360.
      - name: Test
        id: test
        run: cargo test --features serde

      # One message to the vortiq-ai CI/CD Slack channel, the same message the
      # dev-tools slack-notify action posts for every other repository. Inline,
      # because this repository is public and a public repository cannot use an
      # action from a private one. Same rule: pushes and manual runs always,
      # pull requests only when they fail, cancelled runs never. A pull request
      # from a fork gets no secrets, so it skips. Nothing from the event is
      # interpolated into the script: it reads the commit from GITHUB_EVENT_PATH.
      # Best effort: it cannot fail this job.
      - name: Report to Slack
        if: always() && job.status != 'cancelled' && (github.event_name != 'pull_request' || job.status == 'failure')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0C5N5WQZCP
          RESULT: ${{ job.status }}
          STEPS: >-
            Install Rust 1.98.0=${{ steps.toolchain.conclusion }};
            Check formatting=${{ steps.fmt.conclusion }};
            Clippy=${{ steps.clippy.conclusion }};
            Build=${{ steps.build.conclusion }};
            Test=${{ steps.test.conclusion }}
        run: |
          python3 - <<'PY' || echo "::warning::Slack report failed; ignored"
          import json, os, subprocess, urllib.request
          e = os.environ
          if not e.get("SLACK_BOT_TOKEN"):
              print("SLACK_BOT_TOKEN is not available to this run; not posted")
              raise SystemExit(0)
          event = json.load(open(e["GITHUB_EVENT_PATH"], encoding="utf-8"))
          server, repo, result = e["GITHUB_SERVER_URL"], e["GITHUB_REPOSITORY"], e["RESULT"]
          pr, extra = event.get("pull_request"), ""
          if pr:
              sha, subject = pr["head"]["sha"], pr.get("title", "")
              extra = f" · <{pr['html_url']}|PR #{pr['number']}>"
          else:
              sha, head = e["GITHUB_SHA"], event.get("head_commit") or {}
              subject = (head.get("message") or "").split("\n")[0] if head.get("id") == sha else ""
              if not subject:
                  subject = subprocess.run(["git", "log", "-1", "--format=%s", sha],
                                           capture_output=True, text=True).stdout.strip()
          # Slack reads <, > and & as markup: `Vec<Cell>` would render broken and
          # `<!here>` in a pull-request title would ping the channel.
          esc = lambda t: t.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
          subject = esc(subject)
          failed = next((n.strip() for n, _, o in (p.rpartition("=") for p in e["STEPS"].split(";"))
                         if o.strip() == "failure"), "")
          at = f" at *{failed}*" if failed and result != "success" else ""
          icon = ":white_check_mark:" if result == "success" else ":x:"
          ref = esc(e.get("GITHUB_HEAD_REF") or e["GITHUB_REF_NAME"])
          actor = e.get("GITHUB_TRIGGERING_ACTOR") or e["GITHUB_ACTOR"]
          text = "\n".join([
              f"{icon} *{repo.split('/')[-1]}* · `{ref}` · CI {result}{at} · by {actor}",
              f"<{server}/{repo}/commit/{sha}|`{sha[:8]}`> {subject}{extra}".rstrip(),
              f"<{server}/{repo}/actions/runs/{e['GITHUB_RUN_ID']}|CI run>",
          ])
          if e.get("NOTIFY_DRY_RUN") == "1":
              print(text)
              raise SystemExit(0)
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage", method="POST",
              data=json.dumps({"channel": e["SLACK_CHANNEL"], "text": text,
                               "unfurl_links": False, "unfurl_media": False}).encode(),
              headers={"Authorization": f"Bearer {e['SLACK_BOT_TOKEN']}",
                       "Content-Type": "application/json; charset=utf-8"})
          reply = json.load(urllib.request.urlopen(req, timeout=15))
          print("posted" if reply.get("ok") else f"::warning::Slack refused the message: {reply.get('error')}")
          PY
