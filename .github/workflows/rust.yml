# CI for vortiq-ai/umya-spreadsheet-serde, the fork every vortiq-ai Rust repo builds
# `umya-spreadsheet` from (all split Cargo.lock files pin a commit of this repo).
#
# WHAT IT GATES is what the consumers compile: the library with the `serde`
# feature, built and tested. beyondcell-common, beyondcell-workbook and
# beyondcell-workbook-pod each declare `features = ["serde"]`, and every other
# repo reaches umya through them, so no consumer builds another feature set.
#
# GitHub-hosted on purpose. This repository is PUBLIC (a fork of
# MathNya/umya-spreadsheet). The org's self-hosted runner group refuses public
# repositories, and a public repository must never run on self-hosted runners:
# a pull request from any fork would execute code inside the cluster. Hosted
# minutes are free for public repositories.
#
# Rust 1.98.0, pinned: the version the consumers' build image (vq-builder) uses.
#
# DELIBERATELY NOT GATED: rustfmt and clippy. Measured 2026-09-30: nightly rustfmt
# reports 14 hunks in 5 files, and clippy -D warnings (the crate enables
# clippy::pedantic) fails with 3 errors on 1.95, 1.98 and 1.100-beta. Every one
# is on a line this fork added; upstream's base 35bbffa4 passes both. Fixing them
# is the code owners' call. A gate that is red on arrival teaches everyone to
# ignore CI.
#
# NOT BUILT HERE: wasm32. umya alone cannot build for it, because getrandom 0.4
# needs the `wasm_js` opt-in that beyondcell-frontend/codec-wasm declares. That
# repo's build:wasm step is the wasm gate for a change here.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Run it by hand from the Actions tab, e.g. after a toolchain or runner change.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing fetches again, and the tests run this repository's code.
          persist-credentials: false

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --features serde

      # Not --all-targets: that skips the doc-tests, which are 79 of the 360.
      - name: Test
        run: cargo test --features serde
